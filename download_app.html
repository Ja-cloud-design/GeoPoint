<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar GeoPoint Play Store</title>
    <link rel="stylesheet" href="./estilos.css" type="text/css">
    <style>
.download-actions { margin-top:24px; }
.download-button { display:inline-block; padding:12px 20px; border-radius:8px; background:#1a73e8; color:#fff; text-decoration:none; font-weight:bold; }
.download-button:hover { opacity:.9; }
.direct-link { margin-top:22px; }
.direct-link a { color:inherit; word-break:break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Descarga GeoPoint</h1>
        <p>Escanea el código QR con la cámara de tu móvil o pulsa el botón para abrir directamente la ficha de GeoPoint en Google Play Store.</p>

        <img src="GeoPointDownload.png" class="img-QR" alt="Código QR para descargar GeoPoint">

        <div class="download-actions">
            <a class="download-button" href="https://play.google.com/store/apps/details?id=com.jama.geopoint" target="_blank" rel="noopener">Abrir en Google Play</a>
        </div>

        <div class="direct-link">
            <h2>Enlace directo</h2>
            <p><a href="https://play.google.com/store/apps/details?id=com.jama.geopoint" target="_blank" rel="noopener">https://play.google.com/store/apps/details?id=com.jama.geopoint</a></p>
        </div>
    </div>
</body>
</html>
